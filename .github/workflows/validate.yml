name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural checks (platform-agnostic)
        run: scripts/validate.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate Claude Code manifests
        run: claude plugin validate . --strict

      - name: Version must be bumped when content changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- skills docs | head -n1 || true)
          [ -n "$changed" ] || exit 0
          old=$(git show "origin/${{ github.base_ref }}:.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || echo "")
          new=$(jq -r .version .claude-plugin/plugin.json)
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "skills/docs changed but version is still $new; bump it or installed copies never update"
            exit 1
          fi
